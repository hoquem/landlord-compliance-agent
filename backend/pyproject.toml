[project]
name = "backend"
version = "0.1.0"
description = "Landlord compliance agent backend"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "crewai>=1.15.8",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
